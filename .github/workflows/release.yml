name: release

on:
  workflow_dispatch:
  push:
    paths:
      - 'Surfing.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      isAlpha: false
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Get Version number
        id: version
        run: |
          version=$(grep 'version=' module.prop | awk -F '=' '{print $2}' | sed 's/ (.*)//')
          echo "TAG_NAME=${version}" >> $GITHUB_ENV
          echo "Version extracted: ${version}"

      - name: Run build.sh
        run: sh build.sh

      - name: Verify module archive
        run: |
          archive="Surfing_${TAG_NAME}_release.zip"
          test -s "$archive"
          unzip -Z1 "$archive" > archive-files.txt
          grep -Eq '^\.?/?module\.prop$' archive-files.txt
          grep -Eq '^\.?/?customize\.sh$' archive-files.txt
          grep -Eq '^\.?/?META-INF/com/google/android/update-binary$' archive-files.txt
          grep -Eq '^\.?/?box_bll/clash/config\.yaml$' archive-files.txt
          grep -Eq '^\.?/?box_bll/clash/webroot/Zash/index\.html$' archive-files.txt
          test "$(grep -Ec '^\.?/?box_bll/clash/rules/ACL4SSR_.*\.list$' archive-files.txt)" -eq 31
          echo "Verified module archive: $archive"

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: Surfing-${{ env.TAG_NAME }}
          path: Surfing_${{ env.TAG_NAME }}_release.zip
          if-no-files-found: error
          retention-days: 30

      - name: Determine Tag Name
        id: tag
        run: echo "TAG_NAME=${{ env.TAG_NAME }}" >> $GITHUB_ENV

      - name: Get Latest Changelog
        id: changelog
        run: |
          latest_version=$(grep -m1 '^# v[0-9.]\+' changelog.md | sed 's/# v//')
          sed -n "/^# v${latest_version}/,/^# v[0-9.]\+/p" changelog.md | sed -e "/^# v${latest_version}/d" -e "/^# v[0-9.]\+/d" > release_notes.txt
          echo "# What's Changed" | cat - release_notes.txt > temp && mv temp release_notes.txt
          echo "CHANGELOG=release_notes.txt" >> $GITHUB_ENV

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: Surfing_${{ env.TAG_NAME }}_release.zip
          generate_release_notes: false
          body_path: release_notes.txt
