# —————————
# ==== 用户分流配置开始（模块更新时自动保留） ====
# 可直接修改本区的 provider URL、策略和顺序。ACL4SSR 使用可读的 text/yaml，
# 不依赖 .mrs 二进制规则。规则来源: https://github.com/ACL4SSR/ACL4SSR
rule-anchor:
  Local: &Local
    {type: file, behavior: classical, format: text}
  ACL4SSR: &ACL4SSR
    {type: http, behavior: classical, format: text, interval: *Time}
# —————————
rule-providers:
  自定义直连:
    <<: *Local
    path: ./etc/自定义直连.list
  自定义代理:
    <<: *Local
    path: ./etc/自定义代理.list
  自定义拒绝:
    <<: *Local
    path: ./etc/自定义拒绝.list
  ACL4SSR_局域网:
    <<: *ACL4SSR
